map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's DNS, so nginx follows the api container if it gets recreated
    resolver 127.0.0.11 valid=10s;

    # /api/x -> api:8000/x, same as the Vite dev proxy. The WebSocket needs the upgrade headers.
    location /api/ {
        set $api http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    # the app is a single page, so unknown paths (like /runs/1) get index.html
    location / {
        try_files $uri /index.html;
    }
}